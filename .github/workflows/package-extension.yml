name: Package Extension

# OpenSSF Scorecard packaging + signed-releases: build VSIX on tag push and attach cosign signatures.
on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: package-extension-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-targets:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        name: Package (${{ matrix.os }})
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node monorepo
              uses: ./.github/actions/setup-node-monorepo
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install native protoc on Apple Silicon
              if: runner.os == 'macOS' && runner.arch == 'ARM64'
              env:
                  HOMEBREW_NO_AUTO_UPDATE: "1"
                  HOMEBREW_NO_INSTALL_CLEANUP: "1"
                  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
              run: command -v protoc || brew install protobuf

            - name: Build extension artifacts
              run: npm run ci:build

            - name: Package VSIX
              run: npm run package:vsix:all

            - name: Upload targeted VSIX
              uses: actions/upload-artifact@v4
              with:
                  name: vsix-${{ runner.os }}-${{ runner.arch }}
                  path: dist/*.vsix
                  if-no-files-found: error

    release:
        needs: build-targets
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download targeted VSIX packages
              uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  path: dist
                  merge-multiple: true

            - name: Install cosign
              uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

            - name: Sign release artifacts
              run: |
                  for vsix in dist/lumi-vscode-*.vsix dist/lumi-[0-9]*.vsix; do
                    [ -f "$vsix" ] || continue
                    cosign sign-blob --yes --output-signature "${vsix}.sig" --output-certificate "${vsix}.pem" "$vsix"
                  done

            - name: Publish GitHub Release assets
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/lumi-vscode-*.vsix
                      dist/lumi-[0-9]*.vsix
                      dist/*.sig
                      dist/*.pem
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
